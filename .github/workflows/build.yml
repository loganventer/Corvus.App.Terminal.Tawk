# Builds tawk with the real installer and runs the tests on Linux and macOS.
# Windows runs tawk in WSL, which is the Ubuntu job.
name: build

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install with install.sh
        run: ./install.sh --prefix "$HOME/.local" --yes

      - name: Installed binary runs
        run: '"$HOME/.local/bin/tawk" --version'

      - name: Tests
        run: |
          if [ "$(uname -s)" = Darwin ]; then
            export PKG_CONFIG_PATH="$(brew --prefix ncurses)/lib/pkgconfig:$(brew --prefix sqlite)/lib/pkgconfig"
          fi
          make test
